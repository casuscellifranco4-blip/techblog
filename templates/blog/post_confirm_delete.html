{% extends 'base.html' %}

{% block title %}Eliminar publicación — TechBlog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Eliminar publicación</h1>
        <p>¿Estás seguro de que querés eliminar <strong>"{{ object.title }}"</strong>? Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'blog:post_detail' object.slug %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
