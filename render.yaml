# Blueprint de Render (Infrastructure as Code).
# Permite crear el Web Service y la base de datos con un solo clic desde
# https://dashboard.render.com/blueprints usando este archivo.
# También podés configurar el servicio manualmente desde el dashboard
# siguiendo los mismos valores (ver README.md).
services:
  - type: web
    name: techblog
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn techblog.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: techblog-db
          property: connectionString

databases:
  - name: techblog-db
    plan: free
